# Camera Obscura: a missing capability is absent, never broken (ARCHITECTURE.md §4).
# mcelog only works on Intel CPUs with the legacy /dev/mcelog device. In VMs there is no
# such device, and on AMD mcelog refuses to run (AMD uses EDAC/rasdaemon instead), so
# either way it would fail. ExecCondition= exiting non-zero makes systemd skip the unit
# (Result=exec-condition), not fail it. AMD hardware-error logging is a later item
# (ARCHITECTURE.md §12); this still needs verifying on the Ryzen desktop.
[Service]
ExecCondition=/bin/sh -c 'grep -q "^vendor_id[[:space:]]*: GenuineIntel" /proc/cpuinfo && test -e /dev/mcelog'
