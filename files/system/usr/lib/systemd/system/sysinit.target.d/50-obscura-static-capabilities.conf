# Camera Obscura: static capabilities (ARCHITECTURE.md §4, build-brief task 0.2b).
# A static capability is a fixed fact checked once per boot by conditions on its target.
# Something still has to start the target, so sysinit.target wants each static target
# here, and the target's own conditions decide whether it becomes active. A drop-in
# rather than a .wants/ symlink because the repo can't carry symlinks on every checkout.
# Only static capability targets may be listed (tests/unit/test_repo_consistency.py);
# device capabilities are started by detection alone.
[Unit]
Wants=obscura-cap-x86-64-v3.target
