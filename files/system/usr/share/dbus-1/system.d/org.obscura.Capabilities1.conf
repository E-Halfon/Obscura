<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Camera Obscura capability service (ARCHITECTURE.md §4).
     Only obscura-capd may own the name. Anyone may read; there is nothing to write. -->
<busconfig>
  <policy user="obscura-capd">
    <allow own="org.obscura.Capabilities1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.obscura.Capabilities1"
           send_interface="org.obscura.Capabilities1"/>
    <allow send_destination="org.obscura.Capabilities1"
           send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="org.obscura.Capabilities1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.obscura.Capabilities1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.obscura.Capabilities1"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.obscura.Capabilities1"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
  </policy>
</busconfig>
