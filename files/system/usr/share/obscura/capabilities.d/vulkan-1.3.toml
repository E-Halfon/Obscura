# Camera Obscura capability declaration (ARCHITECTURE.md §4, vocabulary in PACKS.md §2).
# Present while obscura-cap-vulkan-1.3.target is active; absent otherwise.
# Detected per DRM render node: udev starts obscura-cap-vulkan-1.3-probe@<node>.service,
# which upholds the target only if vulkaninfo shows a device on that node with
# VK_EXT_physical_device_drm, type integrated or discrete GPU, apiVersion >= 1.3, and a
# hardware driver. CPU (llvmpipe/lavapipe), virtual and other devices never count.

[capability]
name    = "vulkan-1.3"
api     = 1
kind    = "device"
target  = "obscura-cap-vulkan-1.3.target"
summary = "Hardware-accelerated Vulkan 1.3 on an integrated or discrete GPU"
attachable = false   # a GPU isn't something the user is told to connect (Insufficient hardware)
