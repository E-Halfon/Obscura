name: capd-tests
# Unit, consistency, and DBus integration tests for the capability service (task 0.2)
# and the pack format (task 0.21). Integration tests run obscura-capd against a mock
# systemd on a private bus; the pack tests run obscura-pack against that capd. Task 0.2b
# adds a check of the x86-64-v3 CPU conditions against the runner's real CPU, and of the
# probed-capability gate against the runner's real systemd (PID 1).
# Every check after "Run tests" runs even when that step failed (if: !cancelled()), so one
# red unit test can't hide the others.
on:
  push:
    paths:
      - "files/system/usr/**"
      - "tests/**"
      - "docs/PACKS.md"
      - ".claude/hooks/guard_protected_files.py"
      - ".github/workflows/capd-tests.yml"
  pull_request:
    paths:
      - "files/system/usr/**"
      - "tests/**"
      - "docs/PACKS.md"
      - ".claude/hooks/guard_protected_files.py"
      - ".github/workflows/capd-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-dasbus python3-gi python3-dbus python3-dbusmock dbus shellcheck
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: /usr/bin/python3 -m unittest discover -s tests -t . -v
      - name: x86-64-v3 conditions hold on a real x86-64-v3 CPU
        if: ${{ !cancelled() }}
        # A misspelled ConditionCPUFeature= name fails silently (the capability would read
        # absent everywhere), so evaluate every line with systemd itself. The runner's CPU
        # must support x86-64-v3, or this check proves nothing; glibc's loader says so.
        run: |
          set -euo pipefail
          target=files/system/usr/lib/systemd/system/obscura-cap-x86-64-v3.target
          if ! /lib64/ld-linux-x86-64.so.2 --help | grep -q 'x86-64-v3 (supported'; then
            echo "runner CPU lacks x86-64-v3; can't check the conditions here" >&2
            exit 1
          fi
          systemd-analyze --version | head -1
          lines=$(grep -E '^\s*ConditionCPUFeature\s*=' "$target" | sed -E 's/\s+//g')
          count=$(printf '%s\n' "$lines" | grep -c . || true)
          if [ "$count" -lt 17 ]; then
            echo "expected 17 ConditionCPUFeature lines in $target, found $count" >&2
            exit 1
          fi
          failed=0
          while IFS= read -r line; do
            if systemd-analyze condition "$line" >/dev/null 2>&1; then
              echo "ok   $line"
            else
              echo "FAIL $line (unknown name or feature missing)" >&2
              failed=1
            fi
          done <<< "$lines"
          exit "$failed"
      - name: Probed-capability gate on a real systemd
        # A rejecting probe must never make its target active (task 0.2b). Includes a
        # control run without the gate that must show the old bug on this systemd.
        if: ${{ !cancelled() }}
        run: sudo bash tests/ci/upholds-gate.sh
      - name: Shell scripts parse and pass shellcheck
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for script in tests/vm/*.sh tests/ci/*.sh tests/lib/*.sh; do
            bash -n "$script"
          done
          shellcheck --version | head -n 2
          shellcheck -x --severity=warning tests/vm/*.sh tests/ci/*.sh tests/lib/*.sh
      - name: Fail if integration tests were skipped
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          /usr/bin/python3 -m unittest tests.integration.test_capd_dbus tests.integration.test_packs_capd -v 2>&1 | tee integration.log
          if grep -q "skipped" integration.log; then
            echo "integration tests skipped: dependencies missing on the runner" >&2
            exit 1
          fi
