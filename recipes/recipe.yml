---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: obscura
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
# Aurora = Universal Blue's KDE Plasma image (ARCHITECTURE.md §5, §19.3).
# "stable" is Aurora's recommended stream: weekly builds, kernel gated to Fedora CoreOS stable.
base-image: ghcr.io/ublue-os/aurora
image-version: stable

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  # obscura-capd (ARCHITECTURE.md §4) is Python on dasbus; python3-systemd gives it
  # structured journal entries. vulkan-tools provides vulkaninfo for the vulkan-1.3
  # probe (task 0.2b); Aurora's base ships mesa-vulkan-drivers but not vulkan-tools.
  - type: dnf
    install:
      packages:
        - python3-dasbus
        - python3-gobject-base
        - python3-systemd
        - vulkan-tools

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
