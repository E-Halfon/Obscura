# Test fixture for tests/unit, tests/integration, and tests/vm/packs.sh. Never shipped.
[pack]
name      = "pack-fixture-files"
api       = 1
version   = "1.0"
platform  = "retro"
technique = "emulation"
summary   = "Test pack that needs a user-supplied file."
files_dir = "obscura-test"

[handles]
extensions = [".obscuratest"]

# The file is generated by the tests: the text "obscura test file" and a newline.
[[user_supplies]]
id     = "test-dump"
label  = "test file"
kind   = "bios"
file   = "test-dump.dat"
sha256 = ["e9ce2e9e63c7c790370beaff85e240579747b722d436dec95912778e5448ec81"]
